<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360"><rect width="1100" height="360" fill="white"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">LeafMachine2 as an isolated external workflow</text><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#25364a"/></marker></defs><g font-family="Arial" font-size="18" text-anchor="middle"><rect x="45" y="115" width="190" height="100" rx="14" fill="#eef4fb" stroke="#334e7d" stroke-width="2"/><text x="140" y="155" font-weight="bold">OmniPhenoR</text><text x="140" y="182">prepare inputs</text><rect x="325" y="92" width="285" height="146" rx="14" fill="#f7f2e8" stroke="#7a5c20" stroke-width="2"/><text x="468" y="132" font-weight="bold">External Python environment</text><text x="468" y="162">LeafMachine2 repository</text><text x="468" y="190">models + config + GPU</text><rect x="700" y="115" width="190" height="100" rx="14" fill="#eef7ef" stroke="#275d38" stroke-width="2"/><text x="795" y="155" font-weight="bold">Output files</text><text x="795" y="182">tables / images</text><rect x="945" y="115" width="120" height="100" rx="14" fill="#f3f3f3" stroke="#333" stroke-width="2"/><text x="1005" y="150" font-weight="bold">Canonical</text><text x="1005" y="176">objects</text></g><path d="M235 165 L315 165" stroke="#25364a" stroke-width="4" marker-end="url(#b)"/><path d="M610 165 L690 165" stroke="#25364a" stroke-width="4" marker-end="url(#b)"/><path d="M890 165 L935 165" stroke="#25364a" stroke-width="4" marker-end="url(#b)"/><text x="550" y="300" text-anchor="middle" font-family="Arial" font-size="18">Execution is explicit; environment conflicts stay outside the ordinary R package installation.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" fill="white"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Cross-engine validation asks whether the phenotype changes</text><defs><marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#25364a"/></marker></defs><g font-family="Arial" text-anchor="middle" font-size="17"><rect x="35" y="100" width="175" height="75" rx="12" fill="#f4f4f4" stroke="#333"/><text x="122" y="132" font-weight="bold">Same image</text><text x="122" y="156">same truth</text><rect x="290" y="72" width="150" height="60" rx="10" fill="#eef7ef" stroke="#275d38"/><text x="365" y="108">Native R</text><rect x="290" y="145" width="150" height="60" rx="10" fill="#eef4fb" stroke="#334e7d"/><text x="365" y="181">R torch</text><rect x="290" y="218" width="150" height="60" rx="10" fill="#f7f2e8" stroke="#7a5c20"/><text x="365" y="254">PlantCV</text><rect x="290" y="291" width="150" height="60" rx="10" fill="#f7eef8" stroke="#6b3f70"/><text x="365" y="327">External model</text><rect x="555" y="130" width="205" height="150" rx="14" fill="#fafafa" stroke="#333"/><text x="657" y="164" font-weight="bold">Technical metrics</text><text x="657" y="194">Dice / IoU</text><text x="657" y="222">precision / recall</text><text x="657" y="250">runtime / resources</text><rect x="855" y="130" width="205" height="150" rx="14" fill="#fff7e8" stroke="#8a5a00" stroke-width="2"/><text x="957" y="164" font-weight="bold">Scientific endpoint</text><text x="957" y="194">area bias</text><text x="957" y="222">severity bias</text><text x="957" y="250">count / trait stability</text></g><path d="M210 137 L278 102" stroke="#25364a" stroke-width="3" marker-end="url(#d)"/><path d="M210 137 L278 175" stroke="#25364a" stroke-width="3" marker-end="url(#d)"/><path d="M210 137 L278 248" stroke="#25364a" stroke-width="3" marker-end="url(#d)"/><path d="M210 137 L278 321" stroke="#25364a" stroke-width="3" marker-end="url(#d)"/><path d="M440 102 L545 165" stroke="#25364a" stroke-width="3" marker-end="url(#d)"/><path d="M440 175 L545 190" stroke="#25364a" stroke-width="3" marker-end="url(#d)"/><path d="M440 248 L545 220" stroke="#25364a" stroke-width="3" marker-end="url(#d)"/><path d="M440 321 L545 245" stroke="#25364a" stroke-width="3" marker-end="url(#d)"/><path d="M760 205 L845 205" stroke="#25364a" stroke-width="4" marker-end="url(#d)"/><text x="550" y="395" text-anchor="middle" font-family="Arial" font-size="18">A technically different mask may be scientifically equivalent, or a small mask difference may materially bias the derived trait.</text></svg>
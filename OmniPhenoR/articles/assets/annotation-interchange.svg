<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="390" viewBox="0 0 1050 390"><rect width="1050" height="390" fill="white"/><text x="525" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Annotation interchange preserves geometry and class meaning</text><defs><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#25364a"/></marker></defs><g font-family="Arial" text-anchor="middle"><rect x="45" y="120" width="185" height="115" rx="14" fill="#eef4fb" stroke="#334e7d" stroke-width="2"/><text x="138" y="158" font-size="20" font-weight="bold">COCO</text><text x="138" y="186" font-size="17">x, y, width, height</text><rect x="330" y="95" width="390" height="165" rx="18" fill="#f6f6f6" stroke="#1f2937" stroke-width="2"/><text x="525" y="135" font-size="21" font-weight="bold">pheno_detection</text><text x="525" y="168" font-size="17">class + confidence + xmin/ymin/xmax/ymax</text><text x="525" y="198" font-size="17">image dimensions + coordinate system + provenance</text><rect x="820" y="120" width="185" height="115" rx="14" fill="#eef7ef" stroke="#275d38" stroke-width="2"/><text x="912" y="158" font-size="20" font-weight="bold">YOLO</text><text x="912" y="186" font-size="17">normalized center/size</text></g><path d="M230 177 L320 177" stroke="#25364a" stroke-width="4" marker-end="url(#c)"/><path d="M720 177 L810 177" stroke="#25364a" stroke-width="4" marker-end="url(#c)"/><path d="M810 210 L730 210" stroke="#25364a" stroke-width="3" marker-end="url(#c)"/><path d="M320 210 L240 210" stroke="#25364a" stroke-width="3" marker-end="url(#c)"/><text x="525" y="322" text-anchor="middle" font-family="Arial" font-size="18">QC checks invalid boxes, image bounds, duplicates, and class-map consistency before training or validation.</text></svg>